version: "0.1"
product:
  name: "docupay-saas"
  description: "Multi-tenant SaaS platform with billing and slot booking"
  entrypoint: "http://localhost:3000"

requirements:
  - id: "R-010"
    title: "Tenant IDOR Isolation"
    statement: "A customer can only retrieve and view invoices belonging to their own organization"
    critical: true
    sources:
      - "src/routes/invoices.ts"
    probes:
      - type: "exec"
        command: "npx tsx scripts/probes/probe-runner.ts idor"

  - id: "R-015"
    title: "Slot Booking Concurrency Exclusivity"
    statement: "Slot booking must be mutually exclusive; exactly one concurrent booking can succeed per slot"
    critical: true
    sources:
      - "src/routes/slots.ts"
    probes:
      - type: "exec"
        command: "npx tsx scripts/probes/probe-runner.ts concurrency"

  - id: "R-020"
    title: "Admin Role Cancellation Permission"
    statement: "Only admin users can cancel invoices; member users are forbidden"
    critical: true
    sources:
      - "src/routes/invoices.ts"
    probes:
      - type: "exec"
        command: "npx tsx scripts/probes/probe-runner.ts permission"

  - id: "R-025"
    title: "Exact Integer Cents Pricing"
    statement: "Itemized billing calculations must compute VAT in exact integer cents without IEEE-754 floating point drift"
    critical: true
    sources:
      - "src/services/pricing.ts"
    probes:
      - type: "exec"
        command: "npx tsx scripts/probes/probe-runner.ts precision"

  - id: "R-030"
    title: "Invoice PDF Header Formatting"
    statement: "Invoice header formatting utility generates valid standard DocuPay header"
    critical: false
    sources:
      - "src/routes/invoices.ts"
    probes:
      - type: "exec"
        command: "npx tsx scripts/probes/probe-runner.ts format"

invariants:
  - id: "I-005"
    statement: "Soft-deleted invoices must not be included in active billing summary totals"
    sources:
      - "src/routes/invoices.ts"
    probes:
      - type: "exec"
        command: "npx tsx scripts/probes/probe-runner.ts soft-delete"
